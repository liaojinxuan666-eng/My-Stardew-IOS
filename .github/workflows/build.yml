name: Build iOS IPA
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Restore dependencies
        run: dotnet restore "MonoGame test/TemplateiOS/TemplateiOS.csproj"

      - name: Build and Publish
        run: |
          dotnet publish "MonoGame test/TemplateiOS/TemplateiOS.csproj" \
            -f net8.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:BuildIpa=true \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:CodesignRequireProvisioningProfile=false

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TemplateiOS-Unsigned-IPA
          path: TemplateiOS/bin/Release/net8.0-ios/ios-arm64/publish/*.ipa